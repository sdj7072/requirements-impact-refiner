<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Requirements Impact Refiner compact delivery flow</title>
  <desc id="desc">A request becomes a compact impact receipt with paths and coverage, a decision, and a validated full report.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17152B"/>
      <stop offset="1" stop-color="#28224A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080711" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="600" rx="42" fill="url(#background)"/>
  <circle cx="1100" cy="90" r="150" fill="#6D5EF5" opacity="0.13"/>
  <circle cx="105" cy="540" r="190" fill="#FF7F6A" opacity="0.10"/>
  <text x="70" y="82" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">Requirements Impact Refiner</text>
  <text x="70" y="120" fill="#BDB7D9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Compact receipt · full traceability</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(70 190)">
      <rect width="220" height="250" rx="28" fill="#24213C" stroke="#595274"/>
      <rect x="24" y="24" width="58" height="58" rx="16" fill="#6D5EF5"/>
      <text x="53" y="62" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">&lt;&gt;</text>
      <text x="24" y="118" fill="#FFFFFF" font-size="24" font-weight="700">Request</text>
      <text x="24" y="154" fill="#BDB7D9" font-size="16">Change behavior</text>
      <text x="24" y="180" fill="#BDB7D9" font-size="16">without breaking</text>
      <text x="24" y="206" fill="#BDB7D9" font-size="16">existing clients</text>
    </g>

    <path d="M310 315 H360" stroke="#8F84D8" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 300 L368 315 L350 330" fill="none" stroke="#8F84D8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(380 190)">
      <rect width="220" height="250" rx="28" fill="#24213C" stroke="#595274"/>
      <circle cx="53" cy="53" r="29" fill="#FF7F6A"/>
      <circle cx="43" cy="47" r="7" fill="#FFFFFF"/>
      <circle cx="64" cy="47" r="7" fill="#FFFFFF"/>
      <circle cx="53" cy="68" r="7" fill="#FFFFFF"/>
      <path d="M43 47 L64 47 L53 68 Z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <text x="24" y="118" fill="#FFFFFF" font-size="24" font-weight="700">Impact receipt</text>
      <text x="24" y="154" fill="#BDB7D9" font-size="16">Feature · issue</text>
      <text x="24" y="180" fill="#BDB7D9" font-size="16">path · frontier</text>
      <text x="24" y="206" fill="#BDB7D9" font-size="16">coverage footer</text>
    </g>

    <path d="M620 315 H670" stroke="#8F84D8" stroke-width="8" stroke-linecap="round"/>
    <path d="M660 300 L678 315 L660 330" fill="none" stroke="#8F84D8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(690 190)">
      <rect width="190" height="250" rx="28" fill="#24213C" stroke="#595274"/>
      <circle cx="53" cy="53" r="29" fill="#6D5EF5"/>
      <text x="53" y="63" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="800">?</text>
      <text x="24" y="118" fill="#FFFFFF" font-size="24" font-weight="700">Decision</text>
      <text x="24" y="154" fill="#BDB7D9" font-size="16">One focused</text>
      <text x="24" y="180" fill="#BDB7D9" font-size="16">question</text>
      <text x="24" y="206" fill="#BDB7D9" font-size="16">2–3 options</text>
    </g>

    <path d="M900 315 H950" stroke="#8F84D8" stroke-width="8" stroke-linecap="round"/>
    <path d="M940 300 L958 315 L940 330" fill="none" stroke="#8F84D8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(970 190)">
      <rect width="160" height="250" rx="28" fill="#24213C" stroke="#595274"/>
      <path d="M53 22 L82 39 V72 L53 89 L24 72 V39 Z" fill="#FF7F6A"/>
      <path d="M24 39 L53 56 L82 39 M53 56 V89" fill="none" stroke="#FFFFFF" stroke-width="4"/>
      <text x="24" y="118" fill="#FFFFFF" font-size="23" font-weight="700">Full report</text>
      <text x="24" y="154" fill="#BDB7D9" font-size="16">Validated JSON</text>
      <text x="24" y="180" fill="#BDB7D9" font-size="16">Canonical MD</text>
      <text x="24" y="206" fill="#BDB7D9" font-size="16">Exact lineage</text>
    </g>
  </g>
  <text x="600" y="530" text-anchor="middle" fill="#E9E6F7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20">Short chat response. Paths and unknown frontiers stay visible.</text>
</svg>
