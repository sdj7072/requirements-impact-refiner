[tool.ruff]
target-version = "py39"
line-length = 100
preview = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# Ruff's formatter owns line wrapping. Do not split canonical regexes, errors, or fixtures.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally bootstrap local imports by changing sys.path or importlib state first.
"evals/harness/run.py" = ["E402", "UP031"]
"scripts/fast_scan.py" = ["E402"]
"scripts/graph_adapter_ast_grep.py" = ["E402", "UP031"]
"scripts/graph_adapter_joern.py" = ["E402"]
"scripts/graph_providers.py" = ["E402"]
"scripts/impact_renderer.py" = ["E402"]
"scripts/publish-impact-report.py" = ["E402"]
"scripts/render-impact-report.py" = ["E402"]
"scripts/report_store.py" = ["E402"]
"scripts/rir-controller.py" = ["E402"]
"scripts/rir_controller.py" = ["E402"]
"scripts/rir_mcp_server.py" = ["E402"]
"scripts/validate-impact-report.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/fast_scan.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/graph_adapter_ast_grep.py" = ["E402", "UP031"]
"skills/requirements-impact-refiner/scripts/graph_adapter_joern.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/graph_providers.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/impact_renderer.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/publish-impact-report.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/render-impact-report.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/report_store.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/rir-controller.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/rir_controller.py" = ["E402"]
"skills/requirements-impact-refiner/scripts/validate-impact-report.py" = ["E402"]
# Percent formatting below defines externally asserted output and error contracts.
"evals/harness/catalog.py" = ["UP031"]
"evals/harness/evidence.py" = ["UP031"]
"evals/harness/reporting.py" = ["UP031"]
"evals/harness/scoring.py" = ["UP031"]
"scripts/graph_adapter_codegraph.py" = ["UP031"]
"scripts/graph_adapter_scip.py" = ["UP031"]
"scripts/graph_coordinator.py" = ["UP031"]
"skills/requirements-impact-refiner/scripts/graph_adapter_codegraph.py" = ["UP031"]
"skills/requirements-impact-refiner/scripts/graph_adapter_scip.py" = ["UP031"]
"skills/requirements-impact-refiner/scripts/graph_coordinator.py" = ["UP031"]
"tests/test_eval_harness_cli.py" = ["UP031"]
"tests/test_eval_harness_scoring.py" = ["UP031"]
"tests/test_graph_adapters.py" = ["UP031"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
# Root scripts are the complete shipped set; installed-skill copies are mirrors.
source = ["scripts", "evals/harness"]

[tool.coverage.report]
omit = ["tests/*"]
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests", "evals/results"]
