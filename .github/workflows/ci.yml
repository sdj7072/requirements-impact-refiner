name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile every shipped script and the evaluation harness
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m py_compile skills/requirements-impact-refiner/scripts/*.py
          python3 -m compileall -q evals/harness
      - name: Check unfinished markers
        run: |
          if grep -RInE '\[([T]ODO|[T]BD):|<place''holder>' skills .codex-plugin .claude-plugin README*.md; then
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact quality-tool pins
        run: pip install -r requirements-quality.txt
      - name: Run quality gates
        run: python scripts/run-quality-gates.py
